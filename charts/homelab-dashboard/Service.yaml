apiVersion: v1
kind: Service
metadata:
  name: homelab-dashboard
  namespace: monitoring
  labels:
    app: homelab-dashboard
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      nodePort: {{ .Values.service.nodePort }}
  selector:
    app: homelab-dashboard
